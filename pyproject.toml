[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-pricing-calculator-mcp"
version = "0.1.0"
description = "MCP server for AWS Pricing Calculator automation"
authors = [{name = "Eleftherios Chaniotakis"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.9.0",
]
license = {text = "MIT"}

[project.urls]
Homepage = "https://github.com/YOUR_USERNAME/aws-pricing-calculator-mcp"
Repository = "https://github.com/YOUR_USERNAME/aws-pricing-calculator-mcp"

[project.scripts]
aws-pricing-calculator-mcp = "mcp_server.server:run"

[tool.hatch.build.targets.wheel]
packages = ["mcp_server", "scripts"]
